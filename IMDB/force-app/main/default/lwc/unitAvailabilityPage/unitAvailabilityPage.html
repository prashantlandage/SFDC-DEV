<template>
    <lightning-card class="slds-card-align_center" onmouseleave={hideModal}>
      <div class="slds-col slds-size_12-of-12" onmouseenter={hideModal}>
        <h1 class="slds-card__header-title slds-p-around_small">
          <span> UNIT AVAILABILITY </span>
        </h1>
      </div>
      <div
        class="slds-grid slds-wrap slds-gutters_x-small slds-p-around_small"
        onmouseenter={hideModal}
      >
        <div class="slds-col slds-size_2-of-12">
          <lightning-combobox
            class="custom-label-style"
            data-id="projectCombobox"
            label="Project:"
            options={projectListOptions}
            value={selectedProject}
            placeholder="-Select-"
            onchange={handleProjectChange}
          >
          </lightning-combobox>
        </div>
  
        <div class="slds-col slds-size_2-of-12">
          <lightning-combobox
            class="custom-label-style"
            label="Phase:"
            options={phaseListOptions}
            value={selectedPhase}
            placeholder="-Select-"
            onchange={handlePhaseChange}
          >
          </lightning-combobox>
        </div>
        <div class="slds-col slds-size_2-of-12">
          <lightning-combobox
            label="Block:"
            class="custom-label-style"
            options={blockListOptions}
            value={selectedBlock}
            placeholder="-Select-"
            onchange={handleBlockChange}
          >
          </lightning-combobox>
        </div>
        <div class="slds-col slds-size_2-of-12">
          <lightning-combobox
            label="Floor:"
            class="custom-label-style"
            options={floorListOptions}
            value={selectedFloor}
            placeholder="All"
            onchange={handleFloorChange}
          >
          </lightning-combobox>
        </div>
        <div class="slds-col slds-size_2-of-12">
          <lightning-combobox
            label="Booking Status:"
            class="custom-label-style"
            options={bookingstatusoptions}
            value={selectedbookingstatus}
            placeholder="-Select-"
            onchange={handleBookingStatusChange}
          >
          </lightning-combobox>
        </div>
      </div>
      <div
        class="slds-grid slds-wrap slds-gutters_x-small slds-p-around_small"
        onmouseenter={hideModal}
      >
        <div class="slds-col slds-size_2-of-12">
          <lightning-combobox
            label="Ownership Type:"
            class="custom-label-style"
            options={ownershipTypeOptions}
            value={selectedOwnershipType}
            placeholder="-Select-"
            onchange={handleOwernshipTypeChange}
          >
          </lightning-combobox>
        </div>
        <div class="slds-col slds-size_2-of-12">
          <lightning-combobox
            label="Ownership Group Name:"
            class="custom-label-style"
            options={ownershipGroup}
            value={selectedOwnershipGroup}
            placeholder="All"
            onchange={handleOwnershipGroupChange}
          >
          </lightning-combobox>
        </div>
        <div class="slds-col slds-size_2-of-12">
          <lightning-combobox
            label="Facing:"
            class="custom-label-style"
            options={FacingTypeOptions}
            value={selectedFacingValue}
            placeholder="-Select-"
            onchange={handleFacingChange}
          >
          </lightning-combobox>
        </div>
  
        <div class="slds-col slds-size_2-of-12">
          <lightning-combobox
            label="SBUA (Sqft):"
            class="custom-label-style"
            options={SBUAListOptions}
            value={selectedSBUA}
            placeholder="-Select-"
            onchange={handleSBUAChange}
          >
          </lightning-combobox>
        </div>
      </div>
      <!--LENGEND COLORS SECTION Option 1-->
      <div
        class="slds-col slds-size_12-of-12"
        style="border-top: 2px Solid #f2f2f2; margin-top: 20px"
        onmouseenter={hideModal}
      ></div>
      <div
        class="slds-grid slds-wrap slds-p-around_small slds-text-align_center"
        onmouseenter={hideModal}
      >
        <div class="slds-col slds-large-size_1-of-12">
          <div class="legend-circle builder"></div>
          <div class="text-style">Builder</div>
        </div>
        <div class="slds-col slds-large-size_1-of-12">
          <div class="circle landowner"></div>
          <div class="text-style">Land Owner</div>
        </div>
        <div class="slds-col slds-large-size_1-of-12">
          <div class="legend-circle thirdParty"></div>
          <div class="text-style">Third Party</div>
        </div>
        <div class="slds-col slds-large-size_1-of-12">
          <div class="legend-circle no-unit"></div>
          <div class="text-style">No Unit</div>
        </div>
        <div class="slds-col slds-large-size_1-of-12 slds-text-align_center">
          <div>
            <lightning-icon
              icon-name="utility:home"
              alternative-text="Home"
              class="available"
              style="margin: 10px auto"
            ></lightning-icon>
          </div>
  
          <div class="text-style">Available</div>
        </div>
        <div class="slds-col slds-large-size_1-of-12 slds-text-align_center">
          <div>
            <lightning-icon
              icon-name="utility:home"
              alternative-text="Home"
              class="booked"
              style="margin: 10px auto"
            ></lightning-icon>
          </div>
  
          <div class="text-style">Booked</div>
        </div>
        <div class="slds-col slds-large-size_1-of-12 slds-text-align_center">
          <div>
            <lightning-icon
              icon-name="utility:home"
              alternative-text="Home"
              class="blocked"
              style="margin: 10px auto"
            ></lightning-icon>
          </div>
  
          <div class="text-style">Blocked</div>
        </div>
        <div class="slds-col slds-large-size_1-of-12 slds-text-align_center">
          <div>
            <lightning-icon
              icon-name="utility:home"
              alternative-text="Home"
              class="mortgage"
              style="margin: 10px auto"
            ></lightning-icon>
          </div>
  
          <div class="text-style">Mortgage</div>
        </div>
        <div class="slds-col slds-large-size_1-of-12 slds-text-align_center">
          <div>
            <lightning-icon
              icon-name="utility:home"
              alternative-text="Home"
              class="mortgage-block"
              style="margin: 10px auto"
            ></lightning-icon>
          </div>
  
          <div class="text-style">Mortgage & Block</div>
        </div>
        <div class="slds-col slds-large-size_1-of-12 slds-text-align_center">
          <div>
            <lightning-icon
              icon-name="utility:home"
              alternative-text="Home"
              class="not-Open"
              style="margin: 10px auto"
            ></lightning-icon>
          </div>
  
          <div class="text-style">Not Open</div>
        </div>
      </div>
      <div
        class="slds-col slds-size_12-of-12"
        style="border-top: 2px Solid #f2f2f2; margin-top: 2px"
        onmouseenter={hideModal}
      ></div>
      <!--LENGEND COLOR CODE ENDS HERE Option 1 Ends-->
  
      <template if:true={floorWrapperList}>
        <div style="overflow-x: auto">
          <template for:each={floorWrapperList} for:item="floorWrapper">
            <div key={floorWrapper.floor.Id}>
              <!-- Hover event -->
              <lightning-layout style="padding: 10px">
                <lightning-layout-item>
                  <h2
                    style="
                      font-size: 20px;
                      font-weight: 500;
                      color: #121212;
                      padding: 10px;
                      height: 50px;
                      width: 60px;
                    "
                  >
                    {floorWrapper.floor.FloorCodes__c}
                  </h2>
                </lightning-layout-item>
  
                <template
                  for:each={floorWrapper.uniqueUnits}
                  for:item="unitsRecord"
                >
                  <div key={unitsRecord.Id}>
                    <lightning-layout-item
                      style="padding: 30px; height: 50px; width: 50px"
                      size="12"
                      small-device-size="1"
                      medium-device-size="4"
                    >
                      <lightning-icon
                        icon-name="utility:home"
                        alternative-text="Home"
                        class={unitsRecord.iconClass}
                        data-id={unitsRecord.Id}
                        onmouseover={showModal}
                      ></lightning-icon>
                      <!--  <div>
                        <lightning-helptext
                          content={unitsRecord.popoverContent}
                          class="custom-popover"
                        ></lightning-helptext>
                      </div> -->
                      <div style="text-align: end">{unitsRecord.Name}</div>
                    </lightning-layout-item>
                  </div>
                </template>
              </lightning-layout>
            </div>
          </template>
        </div>
      </template>
      <!-- Modal popup -->
      <div if:true={ShowUnitDetails} style={boxClass}>
        <c-unitdetpopup
          unit-id={unitId}
          oncloseevent={hideModal}
        ></c-unitdetpopup>
      </div>
  
      <template if:true={floorWrapperList.error}>
        <p>Error fetching data</p>
      </template>
    </lightning-card>
  </template>
